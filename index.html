<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>LASER GUARD</title>
<style>
:root{--cyan:#36d7ff;--red:#ff405a;--gold:#ffd65a;--panel:rgba(4,14,28,.78);--line:rgba(54,215,255,.65)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020712;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}#app{position:relative;width:100vw;height:100vh;overflow:hidden;background:#020712}#video{display:none}#game{position:absolute;inset:0;width:100%;height:100%;display:block}.hud{position:absolute;inset:0;pointer-events:none}.panel{position:absolute;background:var(--panel);border:1px solid var(--line);box-shadow:0 0 24px rgba(30,180,255,.18),inset 0 0 30px rgba(0,70,120,.12);backdrop-filter:blur(5px)}.scoreBox{left:18px;top:18px;width:260px;padding:16px 20px}.timeBox{right:18px;top:18px;width:230px;padding:16px 20px;text-align:center}.title{position:absolute;top:14px;left:50%;transform:translateX(-50%);text-align:center;width:min(48vw,760px)}.title h1{font-size:clamp(32px,4vw,64px);margin:0;letter-spacing:.08em;text-shadow:0 0 18px rgba(80,170,255,.85)}.title p{margin:6px 0 0;font-weight:700;color:#d6eaff;font-size:clamp(13px,1.5vw,20px)}.label{font-size:14px;color:#77dfff;font-weight:900;letter-spacing:.08em}.big{font-size:clamp(32px,4vw,58px);font-weight:950;line-height:1}.combo{margin-top:8px;color:var(--gold);font-weight:900;font-size:22px}#status{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 18px;border:1px solid rgba(255,214,90,.6);background:rgba(10,10,10,.65);font-weight:800;white-space:nowrap}#shieldWrap{position:absolute;left:18px;bottom:18px;width:360px;padding:14px 18px}#shieldBar{height:16px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:8px}#shieldFill{height:100%;width:100%;background:linear-gradient(90deg,#18b7ff,#61e6ff)}#enemyWrap{position:absolute;right:18px;bottom:18px;width:260px;padding:14px 18px;text-align:center}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,rgba(10,28,58,.72),rgba(2,7,18,.95));padding:20px}.card{width:min(720px,92vw);padding:42px 34px;text-align:center;border:1px solid rgba(54,215,255,.55);background:rgba(3,12,26,.94);box-shadow:0 30px 100px rgba(0,0,0,.45),0 0 50px rgba(40,140,255,.15)}.card h2{margin:0 0 10px;font-size:clamp(38px,7vw,84px);letter-spacing:.06em;text-shadow:0 0 18px rgba(80,170,255,.8)}.card p{font-size:clamp(15px,2vw,21px);line-height:1.7;color:#d9eaff}button{pointer-events:auto;border:1px solid #6be8ff;background:linear-gradient(180deg,#12375c,#07172b);color:white;border-radius:999px;padding:16px 30px;font-weight:950;font-size:20px;cursor:pointer;min-width:220px;box-shadow:0 0 24px rgba(50,190,255,.24)}button:hover{filter:brightness(1.12)}#error{color:#ffb2bd;margin-top:14px;min-height:1.4em}.flash{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:clamp(34px,6vw,78px);font-weight:950;color:var(--gold);text-shadow:0 0 20px rgba(255,180,20,.7);opacity:0}@media(max-width:800px){.scoreBox{width:185px}.timeBox{width:160px}.title{top:95px;width:80vw}#shieldWrap{width:250px}#enemyWrap{width:190px}}
</style>
</head>
<body>
<div id="app">
<video id="video" autoplay muted playsinline></video><canvas id="game"></canvas>
<div class="hud">
<div class="panel scoreBox"><div class="label">SCORE</div><div class="big" id="score">0</div><div class="combo">COMBO × <span id="combo">0</span></div></div>
<div class="title"><h1>LASER GUARD</h1><p>敵のレーザーを光の剣で跳ね返せ！</p></div>
<div class="panel timeBox"><div class="label">TIME</div><div class="big"><span id="time">30</span><small style="font-size:.45em"> 秒</small></div></div>
<div class="panel" id="shieldWrap"><div class="label">BASE SHIELD</div><div id="shieldBar"><div id="shieldFill"></div></div></div>
<div class="panel" id="enemyWrap"><div class="label">ENEMIES</div><div style="font-size:30px;font-weight:950;margin-top:4px"><span id="kills">0</span> 撃破</div></div>
<div id="status">準備中…</div><div id="flash" class="flash">PERFECT!</div>
</div>
<div id="overlay"><div class="card"><h2>LASER GUARD</h2><p>カメラの前に立って、右腕を動かしてください。<br>右腕の方向に<strong>光の剣</strong>が出ます。<br>敵の赤いレーザーを剣で跳ね返して撃破しよう！</p><button id="startBtn">ゲームスタート</button><div id="error"></div><p style="font-size:13px;opacity:.7">※ 映像処理はブラウザ内で行います。</p></div></div>
</div>
<script type="module">
import { FilesetResolver, PoseLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/+esm";
const video=document.getElementById('video'),canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn'),errorEl=document.getElementById('error'),scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),timeEl=document.getElementById('time'),killsEl=document.getElementById('kills'),shieldFill=document.getElementById('shieldFill'),statusEl=document.getElementById('status'),flashEl=document.getElementById('flash');
let pose=null,stream=null,running=false,gameStarted=false,gameEnded=false,lastVideoTime=-1,loopLast=0,lastEnemySpawnAt=0,score=0,combo=0,kills=0,shield=100,duration=30,startAt=0,enemies=[],bolts=[],particles=[],audioCtx=null,sword={x1:0,y1:0,x2:0,y2:0,valid:false};
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
async function initPose(){if(pose)return;statusEl.textContent='人体認識AIを読み込み中…';const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm');pose=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task',delegate:'GPU'},runningMode:'VIDEO',numPoses:1,minPoseDetectionConfidence:.5,minPosePresenceConfidence:.5,minTrackingConfidence:.5})}
async function start(){errorEl.textContent='';startBtn.disabled=true;try{await initPose();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();audioCtx=new (AudioContext||webkitAudioContext)();overlay.style.display='none';running=true;requestAnimationFrame(loop);beginGame()}catch(e){console.error(e);startBtn.disabled=false;errorEl.textContent='カメラを起動できませんでした。Chromeのカメラ許可を確認してください。'}}startBtn.addEventListener('click',start);
function beginGame(){score=0;combo=0;kills=0;shield=100;enemies=[];bolts=[];particles=[];scoreEl.textContent='0';comboEl.textContent='0';killsEl.textContent='0';timeEl.textContent=duration;shieldFill.style.width='100%';startAt=performance.now();lastEnemySpawnAt=0;gameStarted=true;gameEnded=false;statusEl.textContent='右腕を動かしてレーザーを跳ね返そう！'}
function spawnEnemy(now){if(enemies.length>=4)return;const margin=120;const e={x:margin+Math.random()*(innerWidth-margin*2),y:120+Math.random()*Math.min(180,innerHeight*.25),r:34+Math.random()*8,hp:1,phase:Math.random()*Math.PI*2,baseX:0,born:now,shot:500+Math.random()*1000};e.baseX=e.x;enemies.push(e)}
function enemyShoot(e){const target={x:innerWidth*.5+(Math.random()-.5)*180,y:innerHeight*.75},dx=target.x-e.x,dy=target.y-e.y,len=Math.hypot(dx,dy)||1,speed=390+Math.random()*110;bolts.push({x:e.x,y:e.y,vx:dx/len*speed,vy:dy/len*speed,r:8,reflected:false,dead:false});zap(150,.05)}
function zap(freq=320,dur=.06){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type='sawtooth';o.frequency.setValueAtTime(freq,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(80,freq*.45),audioCtx.currentTime+dur);g.gain.setValueAtTime(.06,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur)}
function updatePose(now){sword.valid=false;if(!pose||video.readyState<2||video.currentTime===lastVideoTime)return;lastVideoTime=video.currentTime;const res=pose.detectForVideo(video,now);if(!res.landmarks?.length){statusEl.textContent='人を探しています…少しカメラから離れてください';return}const lm=res.landmarks[0],elbow=lm[14],wrist=lm[16];if(!elbow||!wrist)return;const ex=(1-elbow.x)*innerWidth,ey=elbow.y*innerHeight,wx=(1-wrist.x)*innerWidth,wy=wrist.y*innerHeight,dx=wx-ex,dy=wy-ey,len=Math.hypot(dx,dy);if(len<8)return;const ux=dx/len,uy=dy/len,bladeLen=Math.min(340,Math.max(220,innerHeight*.30));sword={x1:wx,y1:wy,x2:wx+ux*bladeLen,y2:wy+uy*bladeLen,valid:true};statusEl.textContent=gameEnded?'ゲーム終了！':'右腕でレーザーを跳ね返せ！'}
function pointSegDist(px,py,x1,y1,x2,y2){const vx=x2-x1,vy=y2-y1,wx=px-x1,wy=py-y1,c1=vx*wx+vy*wy;if(c1<=0)return Math.hypot(px-x1,py-y1);const c2=vx*vx+vy*vy;if(c2<=c1)return Math.hypot(px-x2,py-y2);const b=c1/c2,bx=x1+b*vx,by=y1+b*vy;return Math.hypot(px-bx,py-by)}
function reflectBolt(b){if(!sword.valid||b.reflected)return;const d=pointSegDist(b.x,b.y,sword.x1,sword.y1,sword.x2,sword.y2);if(d<26){b.reflected=true;combo++;comboEl.textContent=combo;const live=enemies.filter(e=>e.hp>0);if(live.length){let t=live[0];for(const e of live)if(Math.hypot(e.x-b.x,e.y-b.y)<Math.hypot(t.x-b.x,t.y-b.y))t=e;const dx=t.x-b.x,dy=t.y-b.y,len=Math.hypot(dx,dy)||1;b.vx=dx/len*650;b.vy=dy/len*650}else{b.vx*=-1.2;b.vy*=-1.2}burst(b.x,b.y,'#8deaff',18);zap(720,.08);showFlash(combo>=5?'PERFECT!':'GREAT!')}}
function showFlash(txt){flashEl.textContent=txt;flashEl.style.transition='none';flashEl.style.opacity='1';flashEl.style.transform='translateX(-50%) scale(1.15)';requestAnimationFrame(()=>{flashEl.style.transition='all .6s ease';flashEl.style.opacity='0';flashEl.style.transform='translateX(-50%) scale(.9)'})}
function burst(x,y,color,n=12){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=80+Math.random()*260;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+Math.random()*.3,age:0,color})}}
function updateGame(now,dt){if(!gameStarted||gameEnded)return;const elapsed=(now-startAt)/1000,remain=Math.max(0,Math.ceil(duration-elapsed));timeEl.textContent=remain;if(elapsed>=duration||shield<=0){endGame();return}if(now-lastEnemySpawnAt>1700){spawnEnemy(now);lastEnemySpawnAt=now}for(const e of enemies){e.x=e.baseX+Math.sin(now/900+e.phase)*42;e.shot-=dt*1000;if(e.shot<=0){enemyShoot(e);e.shot=900+Math.random()*1300}}for(const b of bolts){b.x+=b.vx*dt;b.y+=b.vy*dt;reflectBolt(b);if(b.reflected){for(const e of enemies){if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+10){e.hp=0;b.dead=true;kills++;killsEl.textContent=kills;score+=100+Math.min(combo,10)*20;scoreEl.textContent=score;burst(e.x,e.y,'#ff8a43',28);zap(110,.12)}}}else if(b.y>innerHeight-80){b.dead=true;shield=Math.max(0,shield-10);combo=0;comboEl.textContent='0';shieldFill.style.width=shield+'%';burst(b.x,innerHeight-70,'#ff405a',16);zap(90,.1)}if(b.x<-80||b.x>innerWidth+80||b.y<-80||b.y>innerHeight+120)b.dead=true}bolts=bolts.filter(b=>!b.dead);enemies=enemies.filter(e=>e.hp>0);for(const p of particles){p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=280*dt}particles=particles.filter(p=>p.age<p.life)}
function drawBackground(){const g=ctx.createLinearGradient(0,0,0,innerHeight);g.addColorStop(0,'#07172f');g.addColorStop(1,'#020712');ctx.fillStyle=g;ctx.fillRect(0,0,innerWidth,innerHeight);if(video.readyState>=2){ctx.save();ctx.globalAlpha=.22;ctx.translate(innerWidth,0);ctx.scale(-1,1);const vw=video.videoWidth,vh=video.videoHeight,scale=Math.max(innerWidth/vw,innerHeight/vh),dw=vw*scale,dh=vh*scale;ctx.drawImage(video,(innerWidth-dw)/2,(innerHeight-dh)/2,dw,dh);ctx.restore();ctx.fillStyle='rgba(1,7,18,.48)';ctx.fillRect(0,0,innerWidth,innerHeight)}ctx.globalAlpha=.55;for(let i=0;i<70;i++){const x=(i*137.3)%innerWidth,y=(i*71.7)%innerHeight;ctx.fillStyle='rgba(180,225,255,.5)';ctx.fillRect(x,y,1.2,1.2)}ctx.globalAlpha=1}
function drawEnemy(e){ctx.save();ctx.translate(e.x,e.y);ctx.shadowColor='#ff3147';ctx.shadowBlur=22;ctx.fillStyle='#141a25';ctx.beginPath();ctx.arc(0,0,e.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#282f3e';ctx.fillRect(-e.r-18,-7,e.r*2+36,14);ctx.fillStyle='#ff3147';ctx.fillRect(-18,-5,36,10);ctx.fillStyle='#ff7a88';ctx.fillRect(-10,-3,20,6);ctx.fillStyle='#0b111c';ctx.beginPath();ctx.arc(0,12,e.r*.38,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawBolt(b){const len=34,mag=Math.hypot(b.vx,b.vy)||1,ux=b.vx/mag,uy=b.vy/mag;ctx.save();ctx.strokeStyle=b.reflected?'#70ddff':'#ff405a';ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=18;ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(b.x-ux*len,b.y-uy*len);ctx.lineTo(b.x+ux*len,b.y+uy*len);ctx.stroke();ctx.restore()}
function drawSword(){if(!sword.valid)return;ctx.save();ctx.strokeStyle='#8beaff';ctx.shadowColor='#3fa9ff';ctx.shadowBlur=28;ctx.lineWidth=18;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(sword.x1,sword.y1);ctx.lineTo(sword.x2,sword.y2);ctx.stroke();ctx.strokeStyle='#eaffff';ctx.shadowBlur=10;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(sword.x1,sword.y1);ctx.lineTo(sword.x2,sword.y2);ctx.stroke();ctx.restore()}
function drawParticles(){for(const p of particles){ctx.globalAlpha=1-p.age/p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function loop(now){if(!running)return;const dt=Math.min(.033,loopLast?(now-loopLast)/1000:.016);loopLast=now;updatePose(now);updateGame(now,dt);drawBackground();enemies.forEach(drawEnemy);bolts.forEach(drawBolt);drawParticles();drawSword();requestAnimationFrame(loop)}
function endGame(){gameEnded=true;gameStarted=false;overlay.style.display='flex';overlay.innerHTML=`<div class="card"><h2>MISSION END</h2><p style="font-size:clamp(30px,6vw,60px);font-weight:950;margin:8px 0">SCORE ${score}</p><p>撃破数：<strong>${kills}</strong><br>最大コンボ：<strong>${combo}</strong></p><button id="againBtn">もう一度</button></div>`;document.getElementById('againBtn').addEventListener('click',()=>{overlay.style.display='none';beginGame()})}
</script>
</body>
</html>
